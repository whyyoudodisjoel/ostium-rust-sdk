query GetOpenTrades($trader: Bytes!) {
  trades(where: { isOpen: true, trader: $trader }) {
    tradeID
    collateral
    leverage
    highestLeverage
    openPrice
    stopLossPrice
    takeProfitPrice
    isOpen
    timestamp
    isBuy
    notional
    tradeNotional
    funding
    rollover
    trader
    index
    pair {
      id
      feed
      from
      to
      accRollover
      lastRolloverBlock
      rolloverFeePerBlock
      accFundingLong
      spreadP
      accFundingShort
      longOI
      shortOI
      maxOI
      maxLeverage
      hillInflectionPoint
      hillPosScale
      hillNegScale
      springFactor
      sFactorUpScaleP
      sFactorDownScaleP
      lastFundingBlock
      maxFundingFeePerBlock
      lastFundingRate
    }
  }
}
